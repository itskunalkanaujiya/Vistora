# Used by Vercel (built with uv). requirements.txt is the equivalent for pip
# and the Dockerfile; keep the two dependency lists in sync.
[project]
name = "vistora-backend"
version = "0.5.0"
description = "Vistora visual product search API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.143.0",
    "python-multipart==0.0.32",
    "pillow==12.3.0",
    "numpy==2.5.3",
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "python-dotenv==1.2.4",
    "gradio_client==2.7.2",
    "onnxruntime==1.31.0",
]

[tool.vercel]
entrypoint = "main:app"
